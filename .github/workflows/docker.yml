name: Deploy EVNTX backend using docker

on:
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/evntx_api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/evntx_api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/evntx_api:latest
            
            docker stop evntx_api || true
            docker rm evntx_api || true
            
            docker run -d \
              --name evntx_api \
              --restart always \
              -p 8080:8080 \
              --env-file /home/ec2-user/deploy/.env \
              ${{ secrets.DOCKER_USERNAME }}/evntx_api:latest
